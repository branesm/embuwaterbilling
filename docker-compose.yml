version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ewasco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ewasco_admin
      POSTGRES_PASSWORD: ewasco_secure_2024
      POSTGRES_DB: ewasco_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewasco_admin -d ewasco_billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ewasco-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewasco_billing
      DB_USER: ewasco_admin
      DB_PASSWORD: ewasco_secure_2024
      JWT_SECRET: ewasco_jwt_secret_key_2024_secure
      JWT_EXPIRES_IN: 24h
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-EWASCO}
    ports:
      - "5000:5000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ewasco-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ewasco-client
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      - api

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ewasco-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ewasco_billing
      DB_USER: ewasco_admin
      DB_PASSWORD: ewasco_secure_2024
    ports:
      - "5001:5000"

volumes:
  postgres_data:
  api_uploads:
